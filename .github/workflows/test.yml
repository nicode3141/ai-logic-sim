name: Test & Hardening Suite

on:
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Run All Simulator Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Test Suites
        run: node tests/run_all_tests.js
